PLG_SYSTEM_PHOCACOLLAPSE_SHOW_RESET_DESC="Zeigt ein Reset-Icon neben dem Haupt-Button an, um gemerkte Klappzustände auf ihren Anfangszustand zurückzusetzen. Der Button wirkt kaskadierend: Die aktuelle Subform-Ebene wird zurückgesetzt, samt aller darunter verschachtelten Subforms."
PLG_SYSTEM_PHOCACOLLAPSE_RESET_ALL="Diese Subform, samt darin verschachtelter Subforms, auf ihren Anfangszustand zurücksetzen"



