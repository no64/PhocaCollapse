; --- CORE MANIFEST INFO ---
PLG_SYSTEM_PHOCACOLLAPSE="Phoca Collapse System Plugin"

PLG_SYSTEM_PHOCACOLLAPSE_CUSTOM_DESC="<div style=\"text-align: left;\"><p><strong>'Phoca Collapse System Plugin'</strong> optimiert die Verwaltung von Joomla-Unterformularen (Subforms) im Administrations- und Bearbeitungsbereich erheblich. Es erweitert komplexe, wiederholbare und verschachtelte Unterformulare um ergonomische Ein- und Ausklapp-Schaltflächen, um die visuelle Übersicht bei datenlastigen Layouts drastisch zu verbessern. Die Erweiterung bietet intelligente Titel-Extraktionen (inkl. Radio-Buttons und Bildern), kaskadierende Reset-Routinen für verschachtelte Ebenen, integrierte Status-Indikatoren sowie native Listen-Komprimierungen für Beiträge und Menüs.</p><p><span class=\"badge bg-secondary fs-6 mb-2\">WICHTIGER LAYOUT-HINWEIS:</span><br>Damit die Einklapp-Funktion und die Buttons fehlerfrei generiert werden können, müssen die betroffenen Subform-Felder in ihren Feld-Einstellungen zwingend das Layout/Style <span class=\"badge bg-secondary fs-6\">' Formular '</span> nutzen.<br>In den Tabellen- oder Grid-Layouts kann das Plugin baubedingt nicht greifen.</p></div>"


