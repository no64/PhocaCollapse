PLG_SYSTEM_PHOCACOLLAPSE="Phoca Collapse System Plugin"

PLG_SYSTEM_PHOCACOLLAPSE_DESCRIPTION="<div class=\"alert alert-info left\" style=\"text-align: left;\"><p>Phoca Collapse System Plugin ist ein Joomla! CMS Plugin. Es erweitert Joomla-Unterformulare um die Möglichkeit, Inhalte ein- und auszuklappen. Dadurch können Unterformulare besser organisiert werden.</p>Aktivieren und veröffentlichen Sie dieses Plugin im <a style=\"text-decoration: underline\" href=\"index.php?option=com_plugins\">Plugin-Manager</a><br>Weitere Informationen: <a style=\"text-decoration: underline\" href=\"http://www.phoca.cz/\" target=\"_blank\" >Phoca.cz</a><br>Dokumentation: <a style=\"text-decoration: underline\" href=\"http://www.phoca.cz/documentation/\" target=\"_blank\" >Phoca Dokumentation</a><br>Hilfe und Support: <a style=\"text-decoration: underline\" href=\"http://www.phoca.cz/forum/\" target=\"_blank\" >Phoca Forum</a></div>"
