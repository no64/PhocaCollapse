; --- CONFIGURATION FIELD LABELS & DESCRIPTIONS ---
PLG_SYSTEM_PHOCACOLLAPSE_INITIAL_STATE_LABEL="Initial State"
PLG_SYSTEM_PHOCACOLLAPSE_INITIAL_STATE_NO="Expanded"
