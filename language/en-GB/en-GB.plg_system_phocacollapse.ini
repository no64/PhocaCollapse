PLG_SYSTEM_PHOCACOLLAPSE_INITIAL_STATE_DESC="The initial state of repeatable subforms when loading the page."

PLG_SYSTEM_PHOCACOLLAPSE_INDIVIDUAL_LABEL="Subform Buttons"
PLG_SYSTEM_PHOCACOLLAPSE_INDIVIDUAL_DESC="Displays an individual toggle button for each separate subform row."

PLG_SYSTEM_PHOCACOLLAPSE_NESTED_INITIAL_LABEL="Initial State for Nested Subforms"
PLG_SYSTEM_PHOCACOLLAPSE_NESTED_INITIAL_DESC="When the global initial state is set to 'Expanded', this option determines whether deeply nested subforms (subform-in-subform architectures) should still start collapsed to maintain a clean layout overview."


; --- RECONSTRUCTION STATUS INDICATORS ---
PLG_SYSTEM_PHOCACOLLAPSE_PRESERVE_STATE_LABEL="Preserve State"
PLG_SYSTEM_PHOCACOLLAPSE_PRESERVE_STATE_DESC="Remembers the state of manually toggled subforms when the global 'Toggle All' buttons are executed."

PLG_SYSTEM_PHOCACOLLAPSE_RESTORE_STATE_LABEL="Restore State"
PLG_SYSTEM_PHOCACOLLAPSE_RESTORE_STATE_DESC="Exactly restores the layout collapse states of the subforms after saving (applying changes)."

PLG_SYSTEM_PHOCACOLLAPSE_RESTORE_STORAGE_TYPE_LABEL="Storage Type"
PLG_SYSTEM_PHOCACOLLAPSE_RESTORE_STORAGE_TYPE_DESC="Select 'Persistent' to permanently store the subform states within the browser (retained even after logging out or restarting the browser). Select 'Temporary' to store states transiently for the current working session inside the active tab."

PLG_SYSTEM_PHOCACOLLAPSE_STORAGE_SESSION="Temporary (Session Storage)"
PLG_SYSTEM_PHOCACOLLAPSE_STORAGE_LOCAL="Persistent (Local Browser Storage)"

PLG_SYSTEM_PHOCACOLLAPSE_INDICATOR_PRESERVE_ACTIVE="Preserve State: Enabled (Individual collapse status remains protected during global toggle actions)"
PLG_SYSTEM_PHOCACOLLAPSE_INDICATOR_PRESERVE_INACTIVE="Preserve State: Disabled"

PLG_SYSTEM_PHOCACOLLAPSE_INDICATOR_LOCAL="Persistent storage active (State is retained after saving)"
PLG_SYSTEM_PHOCACOLLAPSE_INDICATOR_SESSION="Temporary storage active (State expires after closing the article)"

PLG_SYSTEM_PHOCACOLLAPSE_SHOW_INDICATORS_LABEL="Show Status Icons"
PLG_SYSTEM_PHOCACOLLAPSE_SHOW_INDICATORS_DESC="Choose whether small status indicators (Bookmark/Clock/Database) should be displayed next to the global toggle button to visualize the active storage configuration."

PLG_SYSTEM_PHOCACOLLAPSE_SHOW_RESET_LABEL="Show Reset Button"
PLG_SYSTEM_PHOCACOLLAPSE_SHOW_RESET_DESC="Displays a reset icon next to the main button to revert preserved collapse states back to their initial configuration. The button logic is cascading: it resets the current subform level, including all subforms nested within it."
PLG_SYSTEM_PHOCACOLLAPSE_RESET_ALL="Reset this subform, including all subforms nested within it, back to their initial state"


; --- LISTS AND FRONTEND ---
PLG_SYSTEM_PHOCACOLLAPSE_ACTIVE_IN_FRONTEND_LABEL="Active in Frontend"
PLG_SYSTEM_PHOCACOLLAPSE_ACTIVE_IN_FRONTEND_DESC="Determines whether this plugin is active in the frontend."

PLG_SYSTEM_PHOCACOLLAPSE_LIST_ACTIVE_LABEL="Show in List Views"
PLG_SYSTEM_PHOCACOLLAPSE_LIST_ACTIVE_DESC="If set to YES, the toggle buttons will also be displayed within Joomla core list views (e.g., article manager, menu items, categories) to easily expand or collapse table rows."




; --- CORE MANIFEST INFO ---
PLG_SYSTEM_PHOCACOLLAPSE="Phoca Collapse System Plugin"

PLG_SYSTEM_PHOCACOLLAPSE_CUSTOM_DESC="<div style=\"text-align: left;\"><p><strong>'Phoca Collapse System Plugin'</strong> significantly optimizes the management of Joomla subforms within the administration and editing views. It expands complex, repeatable, and nested subforms with ergonomic expand and collapse toggles to drastically improve visual clarity in data-heavy layouts. This extension features intelligent title extraction (including radio buttons and images), cascading reset routines for nested levels, integrated status indicators, and native compact list views for articles and menus.</p><p><span class=\"badge bg-secondary fs-6 mb-2\">IMPORTANT LAYOUT NOTICE:</span><br>For the collapse functionality and buttons to generate correctly, the respective subform fields must be configured to use the <span class=\"badge bg-secondary fs-6\">' Form '</span> layout/style.<br>The plugin cannot operate within table or form-grid layouts due to core structure limitations.</p></div>"

